name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun fmt --check

      - name: Lint code
        run: bun lint --max-warnings=0

      - name: Run tests
        run: bun test

  version-bump:
    needs: verify
    if: github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.bump.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Compute & apply version bump
        id: bump
        run: |
          git fetch origin main --quiet || true
          ORIGIN_MAIN="$(git rev-parse origin/main 2>/dev/null || echo '')"
          if [ -n "$ORIGIN_MAIN" ] && [ "$ORIGIN_MAIN" != "${{ github.sha }}" ]; then
            echo "origin/main ($ORIGIN_MAIN) moved past ${{ github.sha }}; skipping bump on re-run."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bun scripts/bump-version.ts
          if [ "$(grep '^bumped=' "$GITHUB_OUTPUT" | cut -d= -f2)" = "true" ]; then
            NEW_VER="$(grep '^version=' "$GITHUB_OUTPUT" | cut -d= -f2)"
            bun fmt package.json CHANGELOG.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json CHANGELOG.md
            git commit -m "chore(release): bump version to v$NEW_VER"
            git push origin HEAD:main
            echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [verify, version-bump]
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.version-bump.result == 'success' || needs.version-bump.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version-bump.outputs.ref || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
