name: Commit Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate commit messages
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          if echo "$RANGE" | grep -q '^0000000'; then
            RANGE="-n 1"
          fi
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            MSG="$(git log -1 --pretty=%B "$sha")"
            echo "Checking $sha: $(echo "$MSG" | head -n1)"
            bun scripts/commitlint.ts --msg "$MSG"
          done < <(git rev-list $RANGE)

  format-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check formatting
        run: bun fmt --check

      - name: Lint code
        run: bun lint --max-warnings=0
